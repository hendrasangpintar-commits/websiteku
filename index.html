<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE KING — Panel</title>

<style>
:root {
  --neon: #00ffee;
  --bg: #000;
  --card: #0b0b0b;
  --glow: 0 0 10px var(--neon), 0 0 20px var(--neon), 0 0 40px var(--neon);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--neon);
  font-family: Poppins, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
}
.container {
  width: 90%;
  max-width: 450px;
  padding: 20px;
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--glow);
}
h1 {
  text-shadow: var(--glow);
}
nav button {
  width: 33%;
  padding: 10px;
  background: transparent;
  border: 1px solid var(--neon);
  color: var(--neon);
  border-radius: 10px;
}
.card {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid var(--neon);
  border-radius: 15px;
  box-shadow: var(--glow);
}
.hidden {display:none;}
button.action {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: var(--neon);
  color: #000;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}
#keyBox {
  margin-top: 10px;
  padding: 12px;
  background: #001515;
  border-radius: 10px;
  font-size: 14px;
  letter-spacing: 2px;
  display:none;
}
#copyBtn {display:none;}
</style>
</head>

<body>
<div class="container">
  <h1>THE KING PANEL</h1>

  <nav>
    <button onclick="showPage('user')">User</button>
    <button onclick="showPage('admin')">Admin</button>
    <button onclick="showPage('dashboard')">Dashboard</button>
  </nav>

  <!-- USER PAGE -->
  <div id="user" class="card">
    <h2>User</h2>
    <p>Generate key otomatis.</p>
    <button class="action" onclick="generateKeyUser()">Get Key</button>
    <div id="keyBox"></div>
    <button id="copyBtn" class="action" onclick="copyKey()">Salin</button>
  </div>

  <!-- ADMIN PAGE -->
  <div id="admin" class="card hidden">
    <h2>Admin</h2>
    <p>Buat Premium Key:</p>
    <select id="typeKey">
      <option value="VIP">VEO-VIP</option>
      <option value="B2">B2</option>
      <option value="C5">C5 (Custom)</option>
    </select>
    <input id="customText" style="width:100%;margin-top:10px;" placeholder="Isi Custom (jika C5)" />
    <button class="action" onclick="generateKeyAdmin()">Generate Premium Key</button>
    <div id="adminKey" style="margin-top:15px"></div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboard" class="card hidden">
    <h2>Dashboard</h2>
    <p>Device limit: 1</p>
    <p>Expired: 1 Hari</p>
    <p>Status: <span style="color:lime">Active</span></p>
  </div>
</div>

<script>
function showPage(p){
  document.getElementById('user').classList.add('hidden');
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById(p).classList.remove('hidden');
}

function generateKeyUser(){
  let key = "USR-" + Math.random().toString(36).substring(2,8).toUpperCase() +
    "-" + Date.now().toString().slice(-4);

  let box = document.getElementById('keyBox');
  box.style.display = 'block';
  box.innerText = key;
  document.getElementById('copyBtn').style.display = 'block';
}

function copyKey(){
  navigator.clipboard.writeText(document.getElementById('keyBox').innerText);
  alert("Key disalin!");
}

function generateKeyAdmin(){
  let type = document.getElementById('typeKey').value;
  let custom = document.getElementById('customText').value;

  let base = Math.random().toString(36).substring(2,6).toUpperCase();
  let key = "";

  if(type=="VIP") key = `VEO-VIP-${base}-${Date.now().toString().slice(-3)}`;
  if(type=="B2") key = `B2-${base}-${Date.now().toString().slice(-3)}`;
  if(type=="C5") key = `${custom}-${base}-${Date.now().toString().slice(-3)}`;

  document.getElementById('adminKey').innerText = key;
}
</script>

</body>
  </html>
